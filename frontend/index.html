<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f4f3ef" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon.png" />
    <title>FundScope · FUND VALUATION</title>
    <script>
      // Apply the saved theme before the first paint so the page never flashes
      // the wrong background. The React ThemeProvider takes over after mount.
      (function () {
        try {
          var stored = window.localStorage.getItem("fundscope.theme");
          var mode = stored === "light" || stored === "dark" ? stored : "light";
          document.documentElement.setAttribute("data-theme", mode);
          document.documentElement.style.backgroundColor = mode === "light" ? "#f4f3ef" : "#131311";
        } catch (_) {
          /* storage unavailable: keep the default light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
